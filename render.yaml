# Render Blueprint — free-tier n8n + bot
# NOTE on free tier: Render free Web Services sleep after ~15 min idle.
# First message after idle triggers a cold start(30–60s). Accepted for demo;
# upgrade to a paid instance(or pass cost to client) before going live for a real client.
services:
  - type: web
    name: n8n-leadbot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"
      - key: N8N_BASIC_AUTH_USER
        value: admin
      - key: N8N_BASIC_AUTH_PASSWORD
        sync: false
      - key: N8N_USER_MANAGEMENT_JWT_SECRET
        sync: false
      - key: N8N_SECURE_COOKIE
        value: "true"
      - key: N8N_RUNNERS_ENABLED
        value: "false"
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: NVIDIA_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SITE_TOKEN
        sync: false
      - key: SHOPIFY_SHOP
        sync: false
      - key: SHOPIFY_ADMIN_TOKEN
        sync: false
