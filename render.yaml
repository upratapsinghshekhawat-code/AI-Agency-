class="tok-comment"># Render Blueprint — free-tier n8n + bot
services:
  - type: web
    name: n8n-leadbot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"
      - key: N8N_BASIC_AUTH_USER
        value: admin
      - key: N8N_BASIC_AUTH_PASSWORD
        sync: false
      - key: N8N_USER_MANAGEMENT_JWT_SECRET
        sync: false
      - key: N8N_SECURE_COOKIE
        value: "true"
      - key: N8N_RUNNERS_MODE
        value: internal
      - key: N8N_RUNNERS_TASK_TIMEOUT
        value: "60"
      - key: NODE_OPTIONS
        value: class="tok-comment">--max-old-space-size=384
      - key: NVIDIA_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SITE_TOKEN
        sync: false
      - key: SHOPIFY_SHOP
        sync: false
      - key: SHOPIFY_ADMIN_TOKEN
        sync: false
